min_version = "2026.9.3"

[tools]
rust = { version = "1.98.1", profile = "minimal" }

[vars]
LIBKRUN_SOURCE_REPO = "https://github.com/RobertDeRose/libkrun"
LIBKRUN_REPO = { default = "https://github.com/RobertDeRose/libkrun.git" }
LIBKRUN_COMMIT = "f435571928f12558325af7435dcae8ab6f4dd814"
LIBKRUN_UPSTREAM_BASE = "728df8125077d0db44265f6e997c72b81b65c015"
LIBKRUN_VERSION = "1.19.4"
LIBKRUN_FEATURES = "BLK=1 NET=1"

[tasks.build]
description = "Build the runtime in debug mode"
sources = ["Package.swift", "Package.resolved", "Sources/**/*.swift"]
outputs = [
  ".build/arm64-apple-macosx/debug/container-runtime-krun",
  ".build/arm64-apple-macosx/debug/container-krun-vmm-helper",
]
run = "swift build --force-resolved-versions"

[tasks."libkrun:checkout"]
description = "Check out the pinned libkrun source"
sources = ["mise.toml"]
outputs = [".build-deps/libkrun/.checkout-{{vars.LIBKRUN_COMMIT}}"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

source_dir="$MISE_PROJECT_ROOT/.build-deps/libkrun"
stamp="$source_dir/.checkout-{{vars.LIBKRUN_COMMIT}}"
repo={{ vars.LIBKRUN_REPO | quote }}
commit={{ vars.LIBKRUN_COMMIT | quote }}

rm -rf "$source_dir"
mkdir -p "$(dirname "$source_dir")"
git init -q "$source_dir"
git -C "$source_dir" remote add origin "$repo"
git -C "$source_dir" fetch -q --depth=1 origin "$commit"
git -C "$source_dir" checkout -q --detach FETCH_HEAD

test "$(git -C "$source_dir" rev-parse HEAD)" = "$commit"
touch "$stamp"
'''

[tasks.libkrun]
description = "Build the pinned libkrun dependency"
depends = ["libkrun:checkout"]
sources = [".build-deps/libkrun/.checkout-{{vars.LIBKRUN_COMMIT}}"]
outputs = [".build-deps/libkrun/target/release/libkrun.{{vars.LIBKRUN_VERSION}}.dylib"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

source_dir="$MISE_PROJECT_ROOT/.build-deps/libkrun"
dylib="$source_dir/target/release/libkrun.{{vars.LIBKRUN_VERSION}}.dylib"
llvm_prefix="${LLVM_PREFIX:-$(brew --prefix llvm 2>/dev/null || true)}"
lld_prefix="${LLD_PREFIX:-$(brew --prefix lld 2>/dev/null || true)}"
libclang_link="$source_dir/target/release/libclang.dylib"

[[ -n "$llvm_prefix" ]] || { echo "Homebrew llvm is required to build libkrun" >&2; exit 1; }
[[ -n "$lld_prefix" ]] || { echo "Homebrew lld is required to build libkrun" >&2; exit 1; }
[[ -r "$llvm_prefix/lib/libclang.dylib" ]] || {
  echo "libclang.dylib not found under $llvm_prefix" >&2
  exit 1
}
[[ -x "$lld_prefix/bin/ld.lld" ]] || { echo "ld.lld not found under $lld_prefix" >&2; exit 1; }

mkdir -p "$source_dir/target/release"
ln -sfn "$llvm_prefix/lib/libclang.dylib" "$libclang_link"
trap 'rm -f "$libclang_link"' EXIT

PATH="$lld_prefix/bin:$llvm_prefix/bin:$PATH" \
  LIBCLANG_PATH="$llvm_prefix/lib" \
  make -C "$source_dir" BLK=1 NET=1

[[ -r "$dylib" ]] || { echo "libkrun build did not produce $dylib" >&2; exit 1; }
if otool -L "$dylib" | tail -n +2 | grep -Eq '(/opt/homebrew|/usr/local/(Cellar|opt))'; then
  echo "Bundled libkrun has a Homebrew runtime dependency:" >&2
  otool -L "$dylib" >&2
  exit 1
fi
'''

[tasks."release:build"]
description = "Build the arm64 runtime release binaries"
sources = ["Package.swift", "Package.resolved", "Sources/**/*.swift"]
outputs = [
  ".build/arm64-apple-macosx/release/container-runtime-krun",
  ".build/arm64-apple-macosx/release/container-krun-vmm-helper",
]
run = "swift build --force-resolved-versions -c release --arch arm64"

[tasks.sign]
description = "Ad-hoc sign the release binaries"
depends = ["release:build"]
sources = [
  ".build/arm64-apple-macosx/release/container-runtime-krun",
  ".build/arm64-apple-macosx/release/container-krun-vmm-helper",
  "signing/hypervisor.entitlements",
]
outputs = [".build/arm64-apple-macosx/release/.container-runtime-krun-signed"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

build_dir="$MISE_PROJECT_ROOT/.build/arm64-apple-macosx/release"
codesign --force --sign - "$build_dir/container-runtime-krun"
codesign --force --sign - --entitlements "$MISE_PROJECT_ROOT/signing/hypervisor.entitlements" \
  "$build_dir/container-krun-vmm-helper"
touch "$build_dir/.container-runtime-krun-signed"
'''

[tasks.release]
description = "Build libkrun and signed arm64 release binaries"
depends = ["libkrun", "sign"]

[tasks.install]
description = "Install the runtime plugin into Apple Container"
depends = ["release"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

install_root="${INSTALL_ROOT:-$(python3 "$MISE_PROJECT_ROOT/scripts/install_root.py" 2>/dev/null || true)}"
[[ -n "$install_root" ]] || {
  echo "Unable to derive INSTALL_ROOT; pass INSTALL_ROOT=/path/to/container prefix" >&2
  exit 1
}

plugin_dir="$install_root/libexec/container-plugins/container-runtime-krun"
build_dir="$MISE_PROJECT_ROOT/.build/arm64-apple-macosx/release"
libkrun_source="$MISE_PROJECT_ROOT/.build-deps/libkrun"
libkrun_dylib="$libkrun_source/target/release/libkrun.{{vars.LIBKRUN_VERSION}}.dylib"
source_repo={{ vars.LIBKRUN_SOURCE_REPO | quote }}
fetch_repo={{ vars.LIBKRUN_REPO | quote }}

mkdir -p "$plugin_dir/bin" "$plugin_dir/lib" "$plugin_dir/share/licenses/libkrun"
cp "$MISE_PROJECT_ROOT/plugin/container-runtime-krun/config.toml" "$plugin_dir/config.toml"

# Replace executable images with new inodes. macOS caches code-signature validation per inode, so
# overwriting an already-executed Mach-O in place can leave the kernel validating stale signature data.
stage_dir="$(mktemp -d "$plugin_dir/.install.XXXXXX")"
trap 'rm -rf "$stage_dir"' EXIT
cp "$build_dir/container-runtime-krun" "$stage_dir/container-runtime-krun"
cp "$build_dir/container-krun-vmm-helper" "$stage_dir/container-krun-vmm-helper"
cp "$libkrun_dylib" "$stage_dir/libkrun.dylib"
mv -f "$stage_dir/container-runtime-krun" "$plugin_dir/bin/container-runtime-krun"
mv -f "$stage_dir/container-krun-vmm-helper" "$plugin_dir/bin/container-krun-vmm-helper"
mv -f "$stage_dir/libkrun.dylib" "$plugin_dir/lib/libkrun.dylib"

cp "$libkrun_source/LICENSE" "$plugin_dir/share/licenses/libkrun/LICENSE"
{
  echo "repository=$source_repo"
  echo "fetch_repository=$fetch_repo"
  echo "commit={{vars.LIBKRUN_COMMIT}}"
  echo "upstream_base={{vars.LIBKRUN_UPSTREAM_BASE}}"
  echo "version={{vars.LIBKRUN_VERSION}}"
  echo "features={{vars.LIBKRUN_FEATURES}}"
  echo "sha256=$(shasum -a 256 "$libkrun_dylib" | awk '{print $1}')"
} >"$plugin_dir/lib/libkrun.provenance"

echo "Installed $plugin_dir"
echo "Restart Apple Container with: container system stop && container system start"
'''

[tasks.uninstall]
description = "Remove the installed runtime plugin"
run = '''
#!/usr/bin/env bash
set -euo pipefail

install_root="${INSTALL_ROOT:-$(python3 "$MISE_PROJECT_ROOT/scripts/install_root.py" 2>/dev/null || true)}"
[[ -n "$install_root" ]] || {
  echo "Unable to derive INSTALL_ROOT; pass INSTALL_ROOT=/path/to/container prefix" >&2
  exit 1
}
rm -rf "$install_root/libexec/container-plugins/container-runtime-krun"
'''

[tasks."profile:hvf-startup"]
description = "Capture a Time Profiler trace around one krun startup"
run = "scripts/profile_hvf_startup.sh"

[tasks."profile:cpu"]
description = "Capture paired Apple/VZ and krun CPU startup profiles"
run = "scripts/profile_runtime_cpu.sh"

[tasks.test]
description = "Run the Swift test suite"
run = "swift test --force-resolved-versions"

[tasks.check]
description = "Run repository static checks"
run = '''
#!/usr/bin/env bash
set -euo pipefail

swift package dump-package >/dev/null
while IFS= read -r file; do
  swiftc -frontend -parse "$file"
done < <(find Sources Tests -name '*.swift' -print)
python3 scripts/check_contract.py
python3 -m unittest discover -s scripts/tests -v
git --no-pager diff --check
'''

[tasks.doctor]
description = "Check local runtime build prerequisites"
run = '''
#!/usr/bin/env bash
set -euo pipefail

for command in container swift git cargo rustc brew make xzcat otool codesign shasum; do
  command -v "$command" >/dev/null || { echo "$command not found" >&2; exit 1; }
done

llvm_prefix="${LLVM_PREFIX:-$(brew --prefix llvm 2>/dev/null || true)}"
lld_prefix="${LLD_PREFIX:-$(brew --prefix lld 2>/dev/null || true)}"
[[ -r "$llvm_prefix/lib/libclang.dylib" ]] || { echo "Homebrew llvm not found" >&2; exit 1; }
[[ -x "$lld_prefix/bin/ld.lld" ]] || { echo "Homebrew lld not found" >&2; exit 1; }

install_root="${INSTALL_ROOT:-$(python3 "$MISE_PROJECT_ROOT/scripts/install_root.py" 2>/dev/null || true)}"
plugin_dir="$install_root/libexec/container-plugins/container-runtime-krun"
libkrun_dylib="$MISE_PROJECT_ROOT/.build-deps/libkrun/target/release/libkrun.{{vars.LIBKRUN_VERSION}}.dylib"

echo "container=$(command -v container)"
echo "swift=$(swift --version | head -n 1)"
echo "rustc=$(rustc --version)"
echo "cargo=$(cargo --version)"
echo "install-root=$install_root"
echo "libkrun-source={{vars.LIBKRUN_SOURCE_REPO}}@{{vars.LIBKRUN_COMMIT}}"
if [[ -r "$plugin_dir/lib/libkrun.dylib" ]]; then
  echo "libkrun=$plugin_dir/lib/libkrun.dylib"
elif [[ -r "$libkrun_dylib" ]]; then
  echo "libkrun=$libkrun_dylib"
else
  echo "libkrun=not built yet"
fi
brew list --versions llvm lld xz vmnet-helper 2>/dev/null || true
'''
