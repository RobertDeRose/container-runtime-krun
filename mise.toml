min_version = "2026.9.3"

[tools]
rust = { version = "1.98.1", profile = "minimal" }

[vars]
LIBKRUN_BASE_COMMIT = "09db77cb6a14fbc29a67870f4dbbea7017541a32"
LIBKRUN_UPSTREAM_BASE = "728df8125077d0db44265f6e997c72b81b65c015"
LIBKRUN_VERSION = "1.19.4"
LIBKRUN_FEATURES = "BLK=1 NET=1"

[tasks.build]
description = "Build the runtime in debug mode"
sources = ["Package.swift", "Package.resolved", "Sources/**/*.swift"]
outputs = [
  ".build/arm64-apple-macosx/debug/container-runtime-krun",
  ".build/arm64-apple-macosx/debug/container-krun-vmm-helper",
]
run = "swift build --force-resolved-versions"

[tasks.libkrun]
description = "Build the patched libkrun checkout under .build-deps/libkrun"
run = "scripts/build_native_libkrun.sh"

[tasks."release:build"]
description = "Build the arm64 runtime release binaries"
sources = ["Package.swift", "Package.resolved", "Sources/**/*.swift"]
outputs = [
  ".build/arm64-apple-macosx/release/container-runtime-krun",
  ".build/arm64-apple-macosx/release/container-krun-vmm-helper",
]
run = "swift build --force-resolved-versions -c release --arch arm64"

[tasks.sign]
description = "Ad-hoc sign the release binaries"
depends = ["release:build"]
sources = [
  ".build/arm64-apple-macosx/release/container-runtime-krun",
  ".build/arm64-apple-macosx/release/container-krun-vmm-helper",
  "signing/hypervisor.entitlements",
]
outputs = [".build/arm64-apple-macosx/release/.container-runtime-krun-signed"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

build_dir="$MISE_PROJECT_ROOT/.build/arm64-apple-macosx/release"
codesign --force --sign - "$build_dir/container-runtime-krun"
codesign --force --sign - --entitlements "$MISE_PROJECT_ROOT/signing/hypervisor.entitlements" \
  "$build_dir/container-krun-vmm-helper"
touch "$build_dir/.container-runtime-krun-signed"
'''

[tasks.release]
description = "Build patched libkrun and signed arm64 release binaries"
depends = ["libkrun", "sign"]

[tasks.install]
description = "Install native vmnet runtime and protected helper (requests sudo)"
depends = ["release"]
run = "scripts/install_native_vmnet.sh"

[tasks."native:install"]
description = "Build/install the patched native-vmnet dependency"
depends = ["install"]

[tasks.uninstall]
description = "Remove the installed runtime plugin"
run = '''
#!/usr/bin/env bash
set -euo pipefail

install_root="${INSTALL_ROOT:-$(python3 "$MISE_PROJECT_ROOT/scripts/install_root.py" 2>/dev/null || true)}"
[[ -n "$install_root" ]] || {
  echo "Unable to derive INSTALL_ROOT; pass INSTALL_ROOT=/path/to/container prefix" >&2
  exit 1
}
rm -rf "$install_root/libexec/container-plugins/container-runtime-krun"
sudo rm -f /etc/sudoers.d/container-runtime-krun-native-vmnet
sudo rm -rf /Library/PrivilegedHelperTools/com.github.robertderose.container-runtime-krun
'''

[tasks."profile:hvf-startup"]
description = "Capture a Time Profiler trace around one krun startup"
run = "scripts/profile_hvf_startup.sh"

[tasks."profile:cpu"]
description = "Capture paired Apple/VZ and krun CPU startup profiles"
run = "scripts/profile_runtime_cpu.sh"

[tasks.test]
description = "Run the Swift test suite"
run = "swift test --force-resolved-versions"

[tasks.check]
description = "Run repository static checks"
run = '''
#!/usr/bin/env bash
set -euo pipefail

swift package dump-package >/dev/null
while IFS= read -r file; do
  swiftc -frontend -parse "$file"
done < <(find Sources Tests -name '*.swift' -print)
python3 scripts/check_contract.py
python3 -m unittest discover -s scripts/tests -v
git --no-pager diff --check
'''

[tasks.doctor]
description = "Check local runtime build prerequisites"
run = '''
#!/usr/bin/env bash
set -euo pipefail

for command in container swift git cargo rustc brew make xzcat otool codesign shasum; do
  command -v "$command" >/dev/null || { echo "$command not found" >&2; exit 1; }
done

llvm_prefix="${LLVM_PREFIX:-$(brew --prefix llvm 2>/dev/null || true)}"
lld_prefix="${LLD_PREFIX:-$(brew --prefix lld 2>/dev/null || true)}"
[[ -r "$llvm_prefix/lib/libclang.dylib" ]] || { echo "Homebrew llvm not found" >&2; exit 1; }
[[ -x "$lld_prefix/bin/ld.lld" ]] || { echo "Homebrew lld not found" >&2; exit 1; }

install_root="${INSTALL_ROOT:-$(python3 "$MISE_PROJECT_ROOT/scripts/install_root.py" 2>/dev/null || true)}"
plugin_dir="$install_root/libexec/container-plugins/container-runtime-krun"
libkrun_source="$MISE_PROJECT_ROOT/.build-deps/libkrun"
libkrun_dylib="$libkrun_source/target/release/libkrun.{{vars.LIBKRUN_VERSION}}.dylib"

echo "container=$(command -v container)"
echo "swift=$(swift --version | head -n 1)"
echo "rustc=$(rustc --version)"
echo "cargo=$(cargo --version)"
echo "install-root=$install_root"
echo "libkrun-source=$libkrun_source"
if [[ -d "$libkrun_source/.git" ]]; then
  echo "libkrun-head=$(git -C "$libkrun_source" rev-parse HEAD)"
fi
if [[ -r "$plugin_dir/lib/libkrun.dylib" ]]; then
  echo "libkrun=$plugin_dir/lib/libkrun.dylib"
elif [[ -r "$libkrun_dylib" ]]; then
  echo "libkrun=$libkrun_dylib"
else
  echo "libkrun=not built yet"
fi
brew list --versions llvm lld xz 2>/dev/null || true
'''

[tasks."validate:native-vmnet"]
description = "Validate the installed native backend, UID drop, and one-NIC packet flow without rebuilding"
run = "scripts/validate_native_vmnet.sh"
